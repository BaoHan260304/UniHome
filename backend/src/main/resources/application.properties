spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/rrmsdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:123456@123}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
server.port=${SERVER_PORT:8080}

# Google Identity Services. Leave blank until configured.
unihome.google.client-id=${GOOGLE_CLIENT_ID:}

# VietQR / bank transfer settings. Replace with your real bank details in .env / environment variables.
unihome.bank.bin=${BANK_BIN:970436}
unihome.bank.account=${BANK_ACCOUNT:0000000000}
unihome.bank.name=${BANK_ACCOUNT_NAME:UNIHOME}

# Development helper only. Set PAYMENT_DEMO=false in production.
unihome.payment.demo=${PAYMENT_DEMO:true}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# Optional AI explanation. Never put this key in React source code.
unihome.ai.gemini-key=${GEMINI_API_KEY:}
unihome.ai.gemini-model=${GEMINI_MODEL:gemini-2.5-flash}

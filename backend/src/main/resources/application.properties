spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/rrmsdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_0900_ai_ci}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
server.port=${SERVER_PORT:8080}

# Google Identity Services
unihome.google.client-id=${GOOGLE_CLIENT_ID:}

# Facebook Login
unihome.facebook.app-id=${FACEBOOK_APP_ID:}
unihome.facebook.app-secret=${FACEBOOK_APP_SECRET:}

# Upload directory
unihome.upload.dir=${UPLOAD_DIR:uploads}

# VietQR / bank transfer settings
unihome.bank.bin=${BANK_BIN:970436}
unihome.bank.account=${BANK_ACCOUNT:0000000000}
unihome.bank.name=${BANK_ACCOUNT_NAME:UNIHOME}

# Development helper only. Set PAYMENT_DEMO=false in production.
unihome.payment.demo=${PAYMENT_DEMO:true}

spring.servlet.multipart.max-file-size=${MAX_UPLOAD_FILE_SIZE:110MB}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_REQUEST_SIZE:120MB}

# Optional AI explanation.
unihome.ai.gemini-key=${GEMINI_API_KEY:}
unihome.ai.gemini-model=${GEMINI_MODEL:gemini-2.5-flash}
